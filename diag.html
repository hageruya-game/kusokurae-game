<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Diag</title><link rel="stylesheet" href="style.css">
<style>#diag-status{position:fixed;top:10px;left:10px;right:10px;
background:rgba(0,0,0,0.9);color:#0f0;font:14px monospace;padding:12px;z-index:9999;
border:2px solid #0f0;border-radius:8px;text-align:center}</style>
</head><body>
  <div class="debug-label" id="debug-label"></div>
  <div id="screen-title" class="screen active">
    <div class="title-top" style="display:none">
      <div class="title-label">⚠ 警告 ⚠</div>
      <div class="title-sub">このゲームは<br>空気を読みません</div>
    </div>
    <div class="title-character" style="display:none">
      <img src="assets/image_0.png" alt="同調圧力の化身" class="character-img pulse">
    </div>
    <div class="comment-bubble" id="title-comment" style="display:none"></div>
    <div class="title-intro">この世界では、<br>空気を読まない者が間違いにされる。</div>
    <h1 class="title-main">圧力回廊</h1>
    <div class="title-sub-copy">― 空気を読まないゲーム ―</div>
    <button id="btn-start" class="btn btn-start">はじめる</button>
    <button id="btn-judge" class="btn btn-judge" style="display:none">連続ジャッジルーム</button>
    <button id="btn-tutorial" class="btn btn-rule-style">ルール説明</button>
    <div class="title-footer" style="display:none">※ 言うことを聞いたら負けです<br>※ ……たぶん</div>
  </div>
<div id="diag-status">計測中...</div>
<script>
window.onload = function() {
  var o = '';
  o += 'viewport: ' + window.innerWidth + 'x' + window.innerHeight + '\n';
  o += 'dpr: ' + window.devicePixelRatio + '\n\n';
  function info(el, label) {
    if (!el) return label + ': NOT FOUND\n';
    var r = el.getBoundingClientRect();
    var cs = getComputedStyle(el);
    var d = cs.display;
    if (d === 'none') return label + ': display:none\n';
    return label + ':\n'
      + '  top=' + r.top.toFixed(0) + ' bot=' + r.bottom.toFixed(0) + ' h=' + r.height.toFixed(0) + '\n'
      + '  pad: ' + cs.paddingTop + ' ' + cs.paddingRight + ' ' + cs.paddingBottom + ' ' + cs.paddingLeft + '\n'
      + '  mar: ' + cs.marginTop + ' ' + cs.marginRight + ' ' + cs.marginBottom + ' ' + cs.marginLeft + '\n'
      + '  overflow-y: ' + cs.overflowY + '  position: ' + cs.position + '\n'
      + '  justify: ' + cs.justifyContent + '  transform: ' + cs.transform + '\n\n';
  }
  var st = document.getElementById('screen-title');
  o += info(st, '#screen-title');
  var sel = ['.title-intro','.title-main','.title-sub-copy','.btn-start','.btn-rule-style'];
  sel.forEach(function(s) { o += info(document.querySelector(s), s); });
  if (st) {
    o += 'scrollTop: ' + st.scrollTop + '  scrollH: ' + st.scrollHeight + '  clientH: ' + st.clientHeight + '\n';
    o += 'OVERFLOWS: ' + (st.scrollHeight > st.clientHeight ? 'YES' : 'NO') + '\n';
  }
  fetch('/diag-result', { method: 'POST', body: o }).then(function() {
    document.getElementById('diag-status').textContent = '送信完了';
  }).catch(function() {
    document.getElementById('diag-status').textContent = '送信失敗';
  });
};
</script>
</body></html>
